name: CI - Build, Scan, Push (Approval Test Mode)

on:
  push:
    branches:
      - main
      - ecs-test

permissions:
  id-token: write
  contents: read

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPO: ${{ vars.ECR_REPO }}
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}

jobs:

  # ======================================================
  # 1️⃣ BUILD + SECURITY SCAN + PUSH (CI LAYER)
  # ======================================================
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::605134434970:role/ECSGithub
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image (Immutable Tag)
        run: |
          docker build -t $CONTAINER_NAME:${{ github.sha }} .

      - name: Scan Docker image (Trivy - DevSecOps)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.CONTAINER_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Tag image for ECR
        run: |
          docker tag \
          $CONTAINER_NAME:${{ github.sha }} \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:${
