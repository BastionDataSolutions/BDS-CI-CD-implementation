name: CI - Build, Push to ECR, Deploy to ECS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::605134434970:role/ECSGithub
          aws-region: us-west-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # -------------------------------
      # Build & Push Image (SHA based)
      # -------------------------------
      - name: Build Docker image
        run: |
          docker build -t demo-task-client:${{ github.sha }} .

      - name: Tag Docker image for ECR
        run: |
          docker tag demo-task-client:${{ github.sha }} \
          605134434970.dkr.ecr.us-west-2.amazonaws.com/demo/demoregistery:${{ github.sha }}

      - name: Push image to ECR (skip if exists)
        run: |
          aws ecr describe-images \
            --repository-name demo/demoregistery \
            --image-ids imageTag=${{ github.sha }} \
          && echo "Image already exists, skipping push" \
          || docker push 605134434970.dkr.ecr.us-west-2.amazonaws.com/demo/demoregistery:${{ github.sha }}

      # ---------------------------------------
      # Dynamic ECS Task Definition Deployment
      # ---------------------------------------
      - name: Fetch current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition demo-task \
            --query taskDefinition \
            > task-def.json

      - name: Create new task definition revision
        run: |
          jq '
            .containerDefinitions[0].image =
            "605134434970.dkr.ecr.us-west-2.amazonaws.com/demo/demoregistery:${{ github.sha }}"
            |
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
          ' task-def.json > new-task-def.json

      - name: Register new ECS task definition
        id: register-task-def
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster blushing-gecko-2ajqo0 \
            --service demo-service \
            --task-definition $TASK_DEF_ARN
