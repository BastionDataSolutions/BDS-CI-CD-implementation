name: CI - Build and Push to ECR

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::605134434970:role/ECSGithub
          aws-region: us-west-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t demo-task-client:${{ github.sha }} .

      - name: Tag Docker image
        run: |
          docker tag demo-task-client:${{ github.sha }} \
          605134434970.dkr.ecr.us-west-2.amazonaws.com/demo/demoregistery:${{ github.sha }}
          aws ecr describe-images \
          --repository-name demo/demoregistery \
          --image-ids imageTag=${{ github.sha }} \
           && echo "Image already exists, skipping push" \
           || docker push 605134434970.dkr.ecr.us-west-2.amazonaws.com/demo/demoregistery:${{ github.sha }}

          

      - name: Push Docker image to ECR
        run: |
          docker push 605134434970.dkr.ecr.us-west-2.amazonaws.com/demo/demoregistery:${{ github.sha }}


      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster demo-cluster \
            --service demo-service \
            --force-new-deployment



