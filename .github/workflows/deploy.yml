name: CI - Build, Push to ECR, Deploy to ECS

on:
  push:
    branches:
      - main
      - ecs-test

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPO: ${{ vars.ECR_REPO }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_DEFINITION_NAME: ${{ vars.ECS_TASK_DEFINITION_NAME }}
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/ECSGithub
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # -------------------------------
      # Build Image
      # -------------------------------
      - name: Build Docker image
        run: |
          docker build -t $CONTAINER_NAME:${{ github.sha }} .

      # -------------------------------
      # Security Scan (MANDATORY)
      # -------------------------------
      - name: Scan Docker image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.CONTAINER_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1

      # -------------------------------
      # Tag & Push Image
      # -------------------------------
      - name: Tag Docker image for ECR
        run: |
          docker tag $CONTAINER_NAME:${{ github.sha }} \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:${{ github.sha }}

      - name: Push image to ECR (skip if exists)
        run: |
          aws ecr describe-images \
            --repository-name $ECR_REPO \
            --image-ids imageTag=${{ github.sha }} \
          && echo "Image already exists, skipping push" \
          || docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:${{ github.sha }}

      # ---------------------------------------
      # ECS DEPLOYMENT (MAIN BRANCH ONLY)
      # ---------------------------------------
      - name: Fetch current ECS task definition
        if: github.ref == 'refs/heads/main'
        run: |
          aws ecs describe-task-definition \
            --task-definition $ECS_TASK_DEFINITION_NAME \
            --query taskDefinition \
            > task-def.json

      - name: Create new task definition revision
        if: github.ref == 'refs/heads/main'
        run: |
          jq '
            .containerDefinitions |= map(
              if .name=="'"$CONTAINER_NAME"'" then
                .image = "'"$AWS_ACCOUNT_ID"'.dkr.ecr.'"$AWS_REGION"'.amazonaws.com/'"$ECR_REPO"':'"${{ github.sha }}"'"
              else . end
            )
            |
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
          ' task-def.json > new-task-def.json

      - name: Register new ECS task definition
        if: github.ref == 'refs/heads/main'
        id: register-task-def
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV

      - name: Update ECS service
        if: github.ref == 'refs/heads/main'
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition $TASK_DEF_ARN
