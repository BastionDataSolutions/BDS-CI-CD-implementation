name: CI - Build & Deploy to ECS (Stage + Prod)

on:
  push:
    branches:
      - ecs-test
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPO: ${{ vars.ECR_REPO }}
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}

jobs:

# -------------------------------
# BUILD + PUSH IMAGE
# -------------------------------
  build-image:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::605134434970:role/ECSGithub
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: set_tag
        run: |
          echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t $CONTAINER_NAME:${{ github.sha }} .

      - name: Tag Docker image for ECR
        run: |
          docker tag "$CONTAINER_NAME:${{ github.sha }}" \
          "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:${{ github.sha }}"

      - name: Push image to ECR
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:${{ github.sha }}

# -------------------------------
# DEPLOY TO STAGE (Approval Gate)
# -------------------------------
  deploy-stage:
    if: github.ref == 'refs/heads/ecs-test'
    needs: build-image
    runs-on: ubuntu-latest
    environment: stage

    env:
      ECS_CLUSTER: ${{ vars.STAGE_ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.STAGE_ECS_SERVICE }}
      ECS_TASK_DEFINITION_NAME: ${{ vars.STAGE_TASK_DEF }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::605134434970:role/ECSGithub
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $ECS_TASK_DEFINITION_NAME \
            --query taskDefinition \
            > task-def.json

      - name: Create new task definition revision
        run: |
          jq '
            .containerDefinitions |= map(
              if .name=="'"$CONTAINER_NAME"'" then
                .image = "'"$AWS_ACCOUNT_ID"'.dkr.ecr.'"$AWS_REGION"'.amazonaws.com/'"$ECR_REPO"':'"${{ github.sha }}"'"
              else . end
            )
            |
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
          ' task-def.json > new-task-def.json

      - name: Register new ECS task definition
        id: register-task-def
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition $TASK_DEF_ARN \
            --force-new-deployment

# -------------------------------
# DEPLOY TO PROD (Approval Gate)
# -------------------------------
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: build-image
    runs-on: ubuntu-latest
    environment: production

    env:
      ECS_CLUSTER: ${{ vars.PROD_ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.PROD_ECS_SERVICE }}
      ECS_TASK_DEFINITION_NAME: ${{ vars.PROD_TASK_DEF }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::605134434970:role/ECSGithub
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $ECS_TASK_DEFINITION_NAME \
            --query taskDefinition \
            > task-def.json

      - name: Create new task definition revision
        run: |
          jq '
            .containerDefinitions |= map(
              if .name=="'"$CONTAINER_NAME"'" then
                .image = "'"$AWS_ACCOUNT_ID"'.dkr.ecr.'"$AWS_REGION"'.amazonaws.com/'"$ECR_REPO"':'"${{ github.sha }}"'"
              else . end
            )
            |
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
          ' task-def.json > new-task-def.json

      - name: Register new ECS task definition
        id: register-task-def
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition $TASK_DEF_ARN \
            --force-new-deployment
